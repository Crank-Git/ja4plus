name: Tests

# `dev` is the default branch and every pull request targets it. `master` stays in both
# lists, so a promotion to the release branch still runs every check.
#
# `workflow_dispatch` starts a run by hand. GitHub sends a push event and a pull request
# event through the webhook path. It starts a manual run through the interface instead.
# When GitHub throttles the webhook path, a push and a pull request create no run, and a
# manual run is the only way to get one. See issue #85.
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

env:
  # The floor starts at the measured baseline of 70.4%, rounded down to a whole percent.
  # It rises with each epic. It never falls.
  COVERAGE_FLOOR: "70"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check lint rules
        run: ruff check ja4plus/ tests/

      - name: Check formatting
        run: ruff format --check ja4plus/ tests/

      - name: Check types
        # FR-typed-api-8 states this command. #46 turned `--strict` on, and the test
        # suite stays out of the type check.
        run: mypy --strict ja4plus/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # The conformance suite runs in the `conformance` job, because a suite that
        # holds registered deviations reports no useful line coverage.
        run: |
          python -m pytest tests/ -m "not spec_validation" -v --tb=short \
            --junitxml=test-results.xml \
            --cov=ja4plus --cov-report=term

      - name: Report line coverage
        if: always()
        run: |
          total=$(python -m coverage report --format=total)
          echo "Line coverage on ${{ matrix.os }} Python ${{ matrix.python-version }}: **${total}%** (floor ${COVERAGE_FLOOR}%)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -lt "$COVERAGE_FLOOR" ]; then
            echo "::error::Line coverage ${total}% is below the floor ${COVERAGE_FLOOR}%."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results.xml

  fuzz:
    # `FR-correctness-audit-13`. The malformed-input suite runs on each pull request
    # the `on:` block above accepts. This job names the suite, so a red
    # malformed-input case is visible without a log search.
    #
    # This job runs one Python version. The `test` job reads `tests/`, so it runs this
    # suite on every version of the matrix and on macOS.
    #
    # The suite cuts each committed capture at test time. Never commit a generated
    # capture: a committed copy stops following the capture it came from.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the malformed-input suite
        run: |
          python -m pytest tests/fuzz/ -v --tb=short \
            --junitxml=fuzz-results.xml

      - name: Upload the malformed-input results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-results
          path: fuzz-results.xml

  samples:
    # `FR-documentation-4`, `FR-documentation-5` and `FR-documentation-6`. Every code
    # sample of the README, every code sample of `docs/`, and every script of
    # `examples/` runs here. This job names the harness, so a rotten sample is visible
    # without a log search.
    #
    # This job runs one Python version. The `test` job reads `tests/`, so it runs the
    # same harness on every version of the matrix and on macOS.
    #
    # No sample reaches a network and no sample opens a capture socket. A sample that
    # cannot run carries a marker that names the reason, and
    # `tests/test_documentation_samples.py` fails a marker that names none.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run every documentation sample and every example script
        run: |
          python -m pytest tests/test_documentation_samples.py tests/test_examples.py \
            -v --tb=short --junitxml=sample-results.xml

      - name: Report the sample census
        if: always()
        run: |
          python -c "from tests.documentation_samples import census; \
            print('Documentation sample census:', census())" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the sample results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sample-results
          path: sample-results.xml

  installed-wheel:
    # `FR-pre-release-validation-7`. This job builds the wheel and the source
    # distribution, installs each one into a clean environment, and produces a
    # fingerprint from that environment. The job name keeps the `installed-wheel` form
    # that `FR-pre-release-validation-7` names.
    #
    # Every other job of this file installs with `pip install -e ".[dev]"`, which puts
    # the source tree on the import path. A case that only imports `ja4plus` therefore
    # measures the checkout. `tests/test_installed_wheel.py` reads `ja4plus.__file__` of
    # the clean environment and fails when that path is not below the `site-packages`
    # directory of that environment.
    #
    # This job runs one Python version. The `test` job reads `tests/`, so it runs this
    # marker on every version of the matrix and on macOS. This job names the marker, so
    # a failure is visible without a log search. The `fuzz` job and the `samples` job
    # state the same reason.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fingerprint a capture from the installed package
        # The clean environment installs no development extra, so `pip` reads the
        # dependency list the artifact ships.
        #
        # #409 added the source-distribution path to the same file. The step therefore
        # builds both artifacts and installs each one, and the marker covers both.
        run: |
          python -m pytest tests/test_installed_wheel.py -m installed_wheel \
            -v --tb=short --junitxml=installed-wheel-results.xml

      - name: Upload the installed-wheel results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: installed-wheel-results
          path: installed-wheel-results.xml

  conformance:
    # `FR-foundation-4`. The vectors are committed under `tests/foxio_vectors`, so this
    # job reads no network. Never add a step that runs `tests/download_test_vectors.py`:
    # a download makes the expected output change without a commit.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the FoxIO conformance suite
        # `tests/foxio_deviations.json` registers each known deviation, and the suite
        # marks it `xfail(strict=True)`. An unregistered failure fails this job, and so
        # does a registered case that starts passing.
        run: |
          python -m pytest tests/ -m spec_validation -v --tb=short \
            --junitxml=conformance-results.xml

      - name: Report the registered deviations
        if: always()
        run: |
          count=$(python -c "from tests.foxio_deviations import load_register; print(len(load_register()))")
          echo "Registered FoxIO deviations: **${count}** (see \`tests/foxio_deviations.json\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: conformance-results
          path: conformance-results.xml
